name: ci-cd

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  REGION: us-central1
  SERVICE: shrinksight-api
  AR_REPO: shrinksight

jobs:
  api-ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run pytest -q

  web-ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          # Optional: direct Cloud Run URL for the streaming endpoint if Hosting buffers SSE
          NEXT_PUBLIC_STREAM_BASE: ${{ vars.STREAM_BASE }}
          # Optional: reCAPTCHA v3 site key (public) once App Check is set up in the Firebase console
          NEXT_PUBLIC_APPCHECK_SITE_KEY: ${{ vars.APPCHECK_SITE_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: web-out
          path: web/out
          retention-days: 3

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [api-ci, web-ci]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # keyless auth to Google Cloud (Workload Identity Federation)
    env:
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: web-out
          path: web/out

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOYER_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Build and push API image
        run: |
          IMAGE="$REGION-docker.pkg.dev/$PROJECT_ID/$AR_REPO/api:${GITHUB_SHA::12}"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
          docker build --build-arg APP_VERSION="${GITHUB_SHA::7}" -t "$IMAGE" api
          docker push "$IMAGE"

      - name: Deploy API to Cloud Run
        run: |
          gcloud run deploy "$SERVICE" \
            --image "$IMAGE" \
            --region "$REGION" \
            --service-account "${{ vars.RUNTIME_SA }}" \
            --allow-unauthenticated \
            --min-instances 0 --max-instances 2 --concurrency 20 \
            --cpu 1 --memory 512Mi --timeout 120 \
            --set-secrets GEMINI_API_KEY=gemini-api-key:latest,AUTH_SECRET=auth-secret:latest \
            --set-env-vars "^@^GCP_PROJECT=$PROJECT_ID@EVIDENCE_BUCKET=${{ vars.EVIDENCE_BUCKET }}@GEMINI_MODEL=${{ vars.GEMINI_MODEL }}@GEMINI_INVESTIGATOR_MODEL=${{ vars.GEMINI_INVESTIGATOR_MODEL }}@GEMINI_FALLBACK_MODELS=${{ vars.GEMINI_FALLBACK_MODELS }}@GEMINI_THINKING_LEVEL=${{ vars.GEMINI_THINKING_LEVEL }}@GEMINI_INVENTORY_MODEL=${{ vars.GEMINI_INVENTORY_MODEL }}@GEMINI_SEED=${{ vars.GEMINI_SEED }}@MEMORY_EXAMPLES=${{ vars.MEMORY_EXAMPLES }}@EDGE_TUNE_MIN_ALERTS=${{ vars.EDGE_TUNE_MIN_ALERTS }}@CORS_ORIGINS=${{ vars.CORS_ORIGINS }}@APP_CHECK_ENFORCE=${{ vars.APP_CHECK_ENFORCE }}@DAILY_INVESTIGATIONS=${{ vars.DAILY_INVESTIGATIONS }}@DEMO_LOGIN=${{ vars.DEMO_LOGIN }}@DEMO_CLIP_UPLOADS=${{ vars.DEMO_CLIP_UPLOADS }}@APP_VERSION=${GITHUB_SHA::7}" \
            --quiet

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Deploy Hosting + Firestore rules
        run: npx --yes firebase-tools@15 deploy --only hosting,firestore:rules --project "$PROJECT_ID" --non-interactive

      - name: Smoke test (through Hosting -> Cloud Run)
        run: |
          URL="https://$PROJECT_ID.web.app/api/healthz"
          for i in 1 2 3 4 5; do
            if curl -fsS "$URL" | tee /dev/stderr | grep -q "\"version\":\"${GITHUB_SHA::7}\""; then
              echo "Smoke test passed"; exit 0
            fi
            echo "Attempt $i failed, retrying in 10s"; sleep 10
          done
          echo "Smoke test failed: $URL did not report version ${GITHUB_SHA::7}"; exit 1
